<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arquivos compartilhados · QR-CODE app</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1020" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M7 7h8v8H7zm2.5 2.5v3h3v-3zM17 7h8v8h-8zm2.5 2.5v3h3v-3zM7 17h8v8H7zm2.5 2.5v3h3v-3zM17 17h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .page-head { display: flex; flex-direction: column; gap: var(--s-3); margin-bottom: var(--s-4); }
  .page-head p { color: var(--c-text-muted); }
  .files { display: grid; gap: var(--s-2); list-style: none; margin: 0; padding: 0; }
  .row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); background: var(--c-surface); border: 1px solid var(--c-border); border-radius: var(--r-md); box-shadow: var(--sh-sm); min-width: 0; }
  .row .ftype { width: 52px; height: 52px; }
  .row-actions { display: flex; gap: var(--s-1); flex: none; }
  .row-actions .btn { padding: 0 var(--s-3); }
  .row-actions .btn svg { width: 18px; height: 18px; }
  @media (max-width: 420px) {
    .row { flex-wrap: wrap; }
    .row .file-body { flex: 1 1 0; }
    .row-actions { width: 100%; }
    .row-actions .btn { flex: 1; }
  }
  .skel-row { display: flex; align-items: center; gap: var(--s-3); padding: var(--s-3); border: 1px solid var(--c-border); border-radius: var(--r-md); background: var(--c-surface); }
  .skel-row .a { width: 52px; height: 52px; flex: none; }
  .skel-row .b { height: 14px; width: 70%; margin-bottom: 8px; }
  .skel-row .c { height: 12px; width: 35%; }
  .note { color: var(--c-text-muted); font-size: var(--fs-xs); margin-top: var(--s-2); }
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="wrap app-header">
  <a class="brand" href="/" aria-label="QR-CODE app, página inicial">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M4 4h10v10H4zm3 3v4h4V7zM18 4h10v10H18zm3 3v4h4V7zM4 18h10v10H4zm3 3v4h4v-4zM18 18h4v4h-4zm6 0h4v4h-4zm-6 6h4v4h-4zm6 0h4v4h-4z"/></svg></span>
    QR-CODE app
  </a>
</header>

<main id="main" class="wrap" aria-busy="true">
  <div class="page-head">
    <div>
      <h1 class="title">Arquivos compartilhados</h1>
      <p id="summary" role="status" aria-live="polite">Carregando…</p>
    </div>
    <div id="all-wrap" hidden>
      <button type="button" id="all" class="btn btn-primary btn-block">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
        <span id="all-label">Baixar todos</span>
      </button>
      <p class="note" id="all-note">O navegador pode pedir permissão para baixar vários arquivos.</p>
    </div>
  </div>

  <div id="skeleton" class="files" aria-hidden="true">
    <div class="skel-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
    <div class="skel-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
    <div class="skel-row"><div class="skel a"></div><div style="flex:1"><div class="skel b"></div><div class="skel c"></div></div></div>
  </div>

  <ul id="list" class="files" aria-label="Arquivos da pasta"></ul>
  <div id="state" class="card empty" hidden></div>
</main>

<footer class="wrap app-footer"><a href="/">Envie seus próprios arquivos com o QR-CODE app</a></footer>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? num(b / 1024) + ' KB' : b < 1073741824 ? num(b / 1048576) + ' MB' : num(b / 1073741824) + ' GB';
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const safeUrl = (u) => /^https?:\/\//i.test(String(u)) ? String(u) : '#';

const KINDS = {
  image: /^(jpe?g|png|gif|webp|avif|bmp|svg)$/,
  video: /^(mp4|mov|m4v|webm|mkv|avi|3gp)$/,
  audio: /^(mp3|wav|m4a|aac|ogg|oga|flac|opus)$/,
  pdf: /^pdf$/,
  doc: /^(docx?|odt|rtf|txt|md|pages|pptx?|odp|key)$/,
  sheet: /^(xlsx?|ods|csv|numbers)$/,
  zip: /^(zip|rar|7z|tar|gz|tgz|bz2)$/,
};
const extOf = (name) => { const i = name.lastIndexOf('.'); return i > 0 ? name.slice(i + 1).toLowerCase() : ''; };
const kindOf = (name) => { const e = extOf(name); for (const k in KINDS) if (KINDS[k].test(e)) return k; return 'other'; };
const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const OPEN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>';
const DL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>';

function typeIcon(f) {
  const kind = kindOf(f.name);
  const thumb = kind === 'image' ? `<img src="${esc(safeUrl(f.url))}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : '';
  return `<span class="ftype" data-kind="${kind}" aria-hidden="true">${FILE_ICON}<span>${esc(extOf(f.name).slice(0, 4))}</span>${thumb}</span>`;
}

function showState(icon, title, text, action) {
  $('skeleton').hidden = true;
  $('list').innerHTML = '';
  $('all-wrap').hidden = true;
  $('main').setAttribute('aria-busy', 'false');
  $('summary').textContent = title;
  $('state').hidden = false;
  $('state').innerHTML = `<div class="empty-icon" aria-hidden="true">${icon}</div><h2>${esc(title)}</h2><p>${esc(text)}</p>${action || ''}`;
}
const ICON_EMPTY = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>';
const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/><path d="M4 4l16 16"/></svg>';
const ICON_WARN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg>';
const HOME = '<a class="btn btn-primary" href="/">Enviar arquivos</a>';

let files = [];
const id = new URLSearchParams(location.search).get('id') || '';

function render() {
  const total = files.reduce((s, f) => s + (f.size || 0), 0);
  $('skeleton').hidden = true;
  $('state').hidden = true;
  $('main').setAttribute('aria-busy', 'false');
  $('summary').textContent = `${plural(files.length, 'arquivo', 'arquivos')} · ${fmt(total)}`;
  $('all-wrap').hidden = files.length < 2;
  $('list').innerHTML = files.map((f, i) => `
    <li class="row">
      ${typeIcon(f)}
      <div class="file-body">
        <div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>
        <div class="file-meta"><span>${fmt(f.size || 0)}</span></div>
      </div>
      <div class="row-actions">
        <a class="btn btn-secondary btn-sm" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener" aria-label="Abrir ${esc(f.name)}">${OPEN_ICON}Abrir</a>
        <a class="btn btn-primary btn-sm" href="${esc(safeUrl(f.downloadUrl))}" aria-label="Baixar ${esc(f.name)}">${DL_ICON}Baixar</a>
      </div>
    </li>`).join('');
}

function load() {
  $('state').hidden = true;
  $('skeleton').hidden = false;
  $('main').setAttribute('aria-busy', 'true');
  $('summary').textContent = 'Carregando…';
  if (!/^[a-z0-9]{10}$/.test(id)) {
    showState(ICON_LINK, 'Link inválido', 'Este link não aponta para uma pasta. Confira se o endereço foi copiado inteiro ou escaneie o QR code novamente.', HOME);
    return;
  }
  fetch('/api/list?id=' + encodeURIComponent(id))
    .then((r) => {
      if (r.status === 400) return Promise.reject({ invalid: true });
      return r.ok ? r.json() : Promise.reject({ status: r.status });
    })
    .then((data) => {
      files = Array.isArray(data) ? data : [];
      if (!files.length) {
        showState(ICON_EMPTY, 'Pasta vazia ou não encontrada', 'Não há arquivos neste link. Eles podem ter sido removidos ou o envio ainda não terminou.', '<button type="button" class="btn btn-secondary" id="retry">Atualizar</button>');
        return;
      }
      render();
    })
    .catch((err) => {
      if (err && err.invalid) showState(ICON_LINK, 'Link inválido', 'Este link não aponta para uma pasta. Confira se o endereço está completo.', HOME);
      else showState(ICON_WARN, 'Não foi possível carregar', navigator.onLine ? 'Ocorreu um erro ao buscar os arquivos. Tente novamente em instantes.' : 'Você está sem conexão com a internet.', '<button type="button" class="btn btn-primary" id="retry">Tentar novamente</button>');
    });
}

$('state').addEventListener('click', (e) => { if (e.target.closest('#retry')) load(); });

$('all').addEventListener('click', async () => {
  const btn = $('all'), label = $('all-label');
  btn.disabled = true;
  for (const [i, f] of files.entries()) {
    label.textContent = `Baixando ${i + 1} de ${files.length}…`;
    const a = document.createElement('a');
    a.href = safeUrl(f.downloadUrl);
    a.download = f.name;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    await new Promise((r) => setTimeout(r, 800));
  }
  label.textContent = 'Downloads iniciados';
  $('all-note').textContent = 'Se algum arquivo não baixou, permita múltiplos downloads ou use o botão “Baixar” de cada arquivo.';
  setTimeout(() => { label.textContent = 'Baixar todos'; btn.disabled = false; }, 2500);
});

load();
</script>
</body>
</html>
