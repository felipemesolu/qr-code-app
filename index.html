<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR-CODE app · Envie um PDF e compartilhe por QR code</title>
<meta name="description" content="Envie um PDF e compartilhe com um QR code que abre o arquivo direto no celular.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1020" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234f46e5'/%3E%3Cpath fill='%23fff' fill-rule='evenodd' d='M7 7h8v8H7zm2.5 2.5v3h3v-3zM17 7h8v8h-8zm2.5 2.5v3h3v-3zM7 17h8v8H7zm2.5 2.5v3h3v-3zM17 17h3v3h-3zm5 0h3v3h-3zm-5 5h3v3h-3zm5 0h3v3h-3z'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/styles.css">
<style>
  .drop {
    width: 100%; min-height: 176px; padding: var(--s-5) var(--s-4);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s-2);
    border: 2px dashed var(--c-border-strong); border-radius: var(--r-lg);
    background: var(--c-surface); color: var(--c-text); cursor: pointer; text-align: center;
    transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease), transform var(--dur-fast) var(--ease);
    -webkit-tap-highlight-color: transparent;
  }
  .drop:hover:not(:disabled), .drop.over { border-color: var(--c-accent); background: var(--c-accent-soft); }
  .drop:active:not(:disabled) { transform: scale(.99); }
  .drop:disabled { opacity: .6; cursor: not-allowed; }
  .drop-icon { width: 52px; height: 52px; border-radius: var(--r-pill); background: var(--c-accent-soft); color: var(--c-accent); display: grid; place-items: center; }
  .drop-icon svg { width: 26px; height: 26px; }
  .drop strong { font-size: var(--fs-lg); font-weight: var(--fw-bold); }
  .drop small { color: var(--c-text-muted); font-size: var(--fs-sm); }
  .drop.compact { min-height: var(--tap); flex-direction: row; padding: var(--s-2) var(--s-4); }
  .drop.compact .drop-icon { width: 32px; height: 32px; }
  .drop.compact .drop-icon svg { width: 18px; height: 18px; }
  .drop.compact strong { font-size: var(--fs-md); font-weight: var(--fw-medium); }
  .drop.compact small { display: none; }
  .t-fine { display: none; }
  @media (hover: hover) and (pointer: fine) { .t-fine { display: inline; } .t-touch { display: none; } }

  .selected-card .file { padding: 0; }

  .action-bar {
    position: sticky; bottom: 0; z-index: 5;
    margin: var(--s-4) calc(-1 * var(--gutter)) 0; padding: var(--s-3) var(--gutter) calc(var(--s-3) + env(safe-area-inset-bottom));
    background: linear-gradient(to bottom, transparent, var(--c-bg) 24%);
  }
  @media (min-width: 640px) { .action-bar { position: static; margin: var(--s-4) 0 0; padding: 0; background: none; } }

  .result { text-align: center; }
  .result h2 { font-size: var(--fs-xl); outline: none; }
  .result .lead { margin-top: var(--s-1); }
  .qr-frame { width: min(100%, 320px); margin: var(--s-5) auto var(--s-4); padding: var(--s-3); background: #fff; border-radius: var(--r-lg); box-shadow: var(--sh-md); }
  .qr-frame img { width: 100%; height: auto; aspect-ratio: 1; image-rendering: pixelated; image-rendering: crisp-edges; }
  .link-field { display: flex; gap: var(--s-2); align-items: stretch; margin-bottom: var(--s-3); }
  .link-field input {
    flex: 1; min-width: 0; min-height: var(--tap); padding: 0 var(--s-3);
    border: 1px solid var(--c-border-strong); border-radius: var(--r-md); background: var(--c-surface-2);
    font-family: var(--font-mono); font-size: var(--fs-sm); color: var(--c-text);
  }
  .result .btn-row > .btn { padding: 0 var(--s-3); white-space: nowrap; flex-basis: 128px; }
  .result-actions { display: grid; gap: var(--s-2); }
  .check { width: 56px; height: 56px; border-radius: var(--r-pill); margin: 0 auto var(--s-3); background: var(--c-success-soft); color: var(--c-success); display: grid; place-items: center; }
  .check svg { width: 28px; height: 28px; }
  .fade-in { animation: fadeIn var(--dur-slow) var(--ease); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } }
</style>
</head>
<body>
<a class="skip" href="#main">Pular para o conteúdo</a>
<header class="wrap app-header">
  <a class="brand" href="/" aria-label="QR-CODE app, página inicial">
    <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><path fill="currentColor" fill-rule="evenodd" d="M4 4h10v10H4zm3 3v4h4V7zM18 4h10v10H18zm3 3v4h4V7zM4 18h10v10H4zm3 3v4h4v-4zM18 18h4v4h-4zm6 0h4v4h-4zm-6 6h4v4h-4zm6 0h4v4h-4z"/></svg></span>
    QR-CODE app
  </a>
</header>

<main id="main" class="wrap">
  <section id="upload" aria-labelledby="upload-title" class="stack">
    <div>
      <h1 id="upload-title" class="title">Envie um PDF e compartilhe por QR code</h1>
      <p class="lead">Quem escanear o QR code abre o PDF direto no celular.</p>
    </div>

    <input type="file" id="files" accept="application/pdf,.pdf" class="sr-only" tabindex="-1" aria-hidden="true">
    <button type="button" class="drop" id="drop" aria-describedby="drop-hint">
      <span class="drop-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M20 16v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2"/></svg></span>
      <strong id="drop-label"><span class="t-touch">Toque para escolher o PDF</span><span class="t-fine">Clique ou arraste o PDF aqui</span></strong>
      <small id="drop-hint">Apenas 1 arquivo PDF · até 50 MB</small>
    </button>

    <div id="selected-card" class="card selected-card" hidden>
      <ul id="selected" class="file-list"></ul>
    </div>

    <div id="error" class="notice notice-error" role="alert"></div>

    <div class="action-bar">
      <button type="button" id="send" class="btn btn-primary btn-block" disabled>
        <span id="send-label">Enviar PDF e gerar QR code</span>
      </button>
    </div>
  </section>

  <section id="result" class="result card fade-in" aria-labelledby="result-title" hidden>
    <div class="check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
    <h2 id="result-title" tabindex="-1">Pronto! Seu PDF está no ar</h2>
    <p class="lead" id="result-sub"></p>
    <div class="qr-frame"><img id="qr" alt="QR code que abre o PDF compartilhado" width="296" height="296"></div>
    <div class="link-field">
      <label for="link" class="sr-only">Link do PDF</label>
      <input type="text" id="link" readonly>
    </div>
    <div class="result-actions">
      <button type="button" id="share" class="btn btn-primary" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3M7 8l5-5 5 5"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg>
        Compartilhar
      </button>
      <div class="btn-row">
        <button type="button" id="copy" class="btn btn-secondary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>
          <span id="copy-label">Copiar link</span>
        </button>
        <a id="download" class="btn btn-secondary" download="qrcode.png">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v12M7 11l5 5 5-5"/><path d="M4 20h16"/></svg>
          Baixar QR code
        </a>
      </div>
      <a id="open" class="btn btn-secondary" target="_blank" rel="noopener">Abrir PDF</a>
      <button type="button" id="reset" class="btn btn-ghost">Enviar outro PDF</button>
    </div>
  </section>

  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</main>

<footer class="wrap app-footer">O PDF fica acessível a quem tiver o link.
  <span class="app-credit">v1.0.0 <span aria-hidden="true">·</span> Desenvolvido por <a href="https://mesolu.com.br" target="_blank" rel="noopener">Felipe MESOLU</a></span>
</footer>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.2/client';
import QRCode from 'https://esm.sh/qrcode@1.5.3';

const $ = (id) => document.getElementById(id);
const MAX = 50 * 1024 * 1024;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (n) => n.toLocaleString('pt-BR', { maximumFractionDigits: 1 });
const fmt = (b) => b < 1024 ? b + ' B' : b < 1048576 ? num(b / 1024) + ' KB' : b < 1073741824 ? num(b / 1048576) + ' MB' : num(b / 1073741824) + ' GB';
const X_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>';
const PDF_ICON = `<span class="ftype" data-kind="pdf" aria-hidden="true">${FILE_ICON}<span>pdf</span></span>`;

let state;
function freshState() { state = { item: null, busy: false, id: null }; }
freshState();

const announce = (msg) => { $('status').textContent = ''; setTimeout(() => { $('status').textContent = msg; }, 30); };
const setError = (msg) => { $('error').textContent = msg || ''; };
const isPdf = (f) => f.type === 'application/pdf' || /\.pdf$/i.test(f.name);

// O Vercel Blob rejeita caminhos com acentos/não-ASCII, então normalizamos o nome
function safeName(name) {
  const base = name.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w .()\-]/g, '_').replace(/\.pdf$/i, '').trim() || 'arquivo';
  return base + '.pdf';
}

function addFiles(list) {
  if (state.busy || !list || !list.length) return;
  const pdf = list.find(isPdf);
  if (!pdf) { setError('Escolha um arquivo PDF.'); announce('Escolha um arquivo PDF.'); return; }
  if (pdf.size > MAX) { setError('O PDF tem mais de 50 MB. Escolha um arquivo menor.'); announce('O PDF tem mais de 50 MB.'); return; }
  setError(list.length > 1 ? 'Só é possível enviar 1 PDF por vez. Usamos o primeiro.' : '');
  state.item = { file: pdf, name: safeName(pdf.name), status: 'ready', progress: 0, error: '' };
  state.id = null; // novo arquivo, novo link
  render();
  announce(`${state.item.name} selecionado.` + (list.length > 1 ? ' Só é possível enviar 1 PDF por vez.' : ''));
}

function metaHTML(it) {
  const parts = [`<span>${fmt(it.file.size)}</span>`];
  if (it.status === 'uploading') parts.push(`<span>Enviando… ${Math.round(it.progress)}%</span>`);
  else if (it.status === 'done') parts.push('<span class="ok">Enviado</span>');
  else if (it.status === 'error') parts.push(`<span class="err">${esc(it.error)}</span>`);
  if (it.name !== it.file.name) parts.push(`<span>Será salvo como “${esc(it.name)}”</span>`);
  return parts.join('<span aria-hidden="true">·</span>');
}

function render() {
  const { item: it, busy } = state;
  $('selected-card').hidden = !it;
  if (it) {
    const showBar = it.status === 'uploading' || it.status === 'done' || it.status === 'error';
    $('selected').innerHTML = `<li class="file is-${it.status}">
      ${PDF_ICON}
      <div class="file-body">
        <div class="file-name" title="${esc(it.name)}">${esc(it.name)}</div>
        <div class="file-meta">${metaHTML(it)}</div>
        ${showBar ? `<div class="progress" role="progressbar" aria-label="Progresso do envio" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(it.progress)}"><i style="width:${it.progress}%"></i></div>` : ''}
      </div>
      ${busy ? '' : `<button type="button" class="icon-btn" data-remove aria-label="Remover ${esc(it.name)}">${X_ICON}</button>`}
    </li>`;
  } else {
    $('selected').innerHTML = '';
  }

  const drop = $('drop');
  drop.disabled = busy;
  drop.classList.toggle('compact', !!it);
  drop.querySelector('.t-touch').textContent = it ? 'Trocar o PDF' : 'Toque para escolher o PDF';
  drop.querySelector('.t-fine').textContent = it ? 'Trocar o PDF (clique ou arraste)' : 'Clique ou arraste o PDF aqui';

  const hasError = !!it && it.status === 'error';
  const send = $('send');
  send.disabled = busy || !it;
  send.setAttribute('aria-busy', String(busy));
  $('send-label').textContent = busy ? 'Enviando…' : hasError ? 'Tentar novamente' : 'Enviar PDF e gerar QR code';
  send.querySelector('.spinner')?.remove();
  if (busy) send.insertAdjacentHTML('afterbegin', '<span class="spinner" aria-hidden="true"></span>');
}

function updateItem(it) {
  const li = $('selected').querySelector('.file');
  if (!li) return;
  li.className = `file is-${it.status}`;
  li.querySelector('.file-meta').innerHTML = metaHTML(it);
  const bar = li.querySelector('.progress');
  if (bar) { bar.setAttribute('aria-valuenow', Math.round(it.progress)); bar.firstElementChild.style.width = it.progress + '%'; }
}

function friendlyError(err) {
  const msg = String((err && err.message) || '');
  if (!navigator.onLine) return 'Sem conexão com a internet.';
  if (/failed to fetch|network|load failed|networkerror/i.test(msg)) return 'Falha de conexão. Verifique a internet e tente de novo.';
  if (/already exists/i.test(msg)) return 'Já existe um arquivo com esse nome.';
  if (/content.?type|not allowed/i.test(msg)) return 'Tipo de arquivo não permitido. Envie um PDF.';
  if (/too large|maximum|exceeds/i.test(msg)) return 'Arquivo maior que o permitido.';
  if (/presigned|token|unauthori|forbidden|40[13]/i.test(msg)) return 'O servidor não autorizou o envio. Tente novamente em instantes.';
  const clean = msg.replace(/^Vercel Blob:\s*/i, '');
  return 'Não foi possível enviar' + (clean ? `: ${clean}` : '.');
}

const makeId = () => Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join('');

async function send() {
  const it = state.item;
  if (state.busy || !it) return;
  it.status = 'uploading'; it.progress = 0; it.error = '';
  state.busy = true;
  state.id = state.id || makeId();
  const id = state.id;
  setError('');
  render();
  announce('Enviando o PDF.');

  try {
    await uploadPresigned(`pdfs/${id}/${it.name}`, it.file, {
      access: 'public',
      handleUploadUrl: '/api/upload',
      contentType: 'application/pdf',
      onUploadProgress: ({ percentage }) => {
        it.progress = Math.max(0, Math.min(100, percentage || 0));
        updateItem(it);
      },
    });
    it.status = 'done';
    it.progress = 100;
  } catch (err) {
    it.status = 'error';
    it.progress = 100;
    it.error = friendlyError(err);
  }

  state.busy = false;
  render();
  if (it.status === 'error') {
    const msg = `${it.error} Toque em “Tentar novamente” ou remova o arquivo.`;
    setError(msg);
    announce(msg);
    return;
  }
  await showResult(id);
}

async function showResult(id) {
  const link = `${location.origin}/p/${id}`;
  try {
    const dataUrl = await QRCode.toDataURL(link, { width: 1024, margin: 2, errorCorrectionLevel: 'M', color: { dark: '#000000', light: '#ffffff' } });
    $('qr').src = dataUrl;
    $('download').href = dataUrl;
    $('download').download = `qrcode-${id}.png`;
  } catch {
    setError('O PDF foi enviado, mas não foi possível gerar o QR code. Use o link abaixo.');
  }
  const it = state.item;
  $('result-sub').textContent = `${it.name} · ${fmt(it.file.size)}`;
  $('link').value = link;
  $('open').href = link;
  const canShare = typeof navigator.share === 'function';
  $('share').hidden = !canShare;
  $('copy').classList.toggle('btn-primary', !canShare);
  $('copy').classList.toggle('btn-secondary', canShare);
  $('upload').hidden = true;
  $('result').hidden = false;
  window.scrollTo({ top: 0 });
  $('result-title').focus({ preventScroll: true });
  announce('Pronto! QR code gerado.');
}

async function copyLink() {
  const input = $('link');
  let ok = false;
  try { await navigator.clipboard.writeText(input.value); ok = true; } catch {
    try { input.focus(); input.select(); ok = document.execCommand('copy'); } catch { ok = false; }
  }
  const btn = $('copy'), label = $('copy-label');
  clearTimeout(copyLink.t);
  if (ok) {
    btn.classList.add('is-success');
    label.textContent = 'Link copiado!';
    announce('Link copiado para a área de transferência.');
  } else {
    input.focus(); input.select();
    label.textContent = 'Selecione e copie';
    announce('Não foi possível copiar automaticamente. O link está selecionado; copie manualmente.');
  }
  copyLink.t = setTimeout(() => { btn.classList.remove('is-success'); label.textContent = 'Copiar link'; }, 2200);
}

async function shareLink() {
  const url = $('link').value;
  try {
    await navigator.share({ title: 'QR-CODE app', text: 'Acesse o PDF que compartilhei:', url });
  } catch (err) {
    if (err && err.name === 'AbortError') return;
    copyLink();
  }
}

function reset() {
  freshState();
  setError('');
  $('result').hidden = true;
  $('upload').hidden = false;
  $('qr').removeAttribute('src');
  render();
  $('drop').focus();
  announce('Pronto para um novo envio.');
}

// Eventos
const input = $('files'), drop = $('drop');
drop.addEventListener('click', () => input.click());
input.addEventListener('change', () => { addFiles([...input.files]); input.value = ''; });
['dragenter', 'dragover'].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); if (!state.busy) drop.classList.add('over'); }));
['dragleave', 'dragend'].forEach((t) => drop.addEventListener(t, () => drop.classList.remove('over')));
drop.addEventListener('drop', (e) => { e.preventDefault(); drop.classList.remove('over'); addFiles([...e.dataTransfer.files]); });
// Evita que soltar fora da área abra o arquivo no navegador
['dragover', 'drop'].forEach((t) => window.addEventListener(t, (e) => { if (!drop.contains(e.target)) e.preventDefault(); }));

$('selected').addEventListener('click', (e) => {
  if (!e.target.closest('[data-remove]') || state.busy || !state.item) return;
  const { name } = state.item;
  state.item = null;
  state.id = null;
  setError('');
  render();
  announce(`${name} removido.`);
  drop.focus();
});

$('send').addEventListener('click', send);
$('copy').addEventListener('click', copyLink);
$('share').addEventListener('click', shareLink);
$('reset').addEventListener('click', reset);
$('link').addEventListener('focus', (e) => e.target.select());
window.addEventListener('beforeunload', (e) => { if (state.busy) { e.preventDefault(); e.returnValue = ''; } });

render();
</script>
</body>
</html>
