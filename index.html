<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR-CODE app</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 520px; margin: 40px auto; padding: 0 16px; color: #222; }
  h1 { font-size: 1.6rem; }
  .drop { display: block; border: 2px dashed #999; border-radius: 12px; padding: 32px; text-align: center; cursor: pointer; }
  .drop.over { background: #eef5ff; border-color: #3b82f6; }
  button { background: #3b82f6; color: #fff; border: 0; border-radius: 8px; padding: 10px 18px; font-size: 1rem; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  ul { padding-left: 18px; }
  #result { display: none; text-align: center; margin-top: 24px; }
  #result img { width: 240px; height: 240px; }
  input[type=text] { width: 100%; padding: 8px; box-sizing: border-box; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<h1>QR-CODE app</h1>
<p>Envie arquivos e compartilhe o QR code. Quem escanear acessa a pasta.</p>

<label class="drop" id="drop">
  <input type="file" id="files" multiple hidden>
  Clique ou arraste arquivos aqui (máx. 50 MB cada)
</label>
<ul id="selected"></ul>
<button id="send" disabled>Enviar e gerar QR code</button>
<p id="status"></p>

<div id="result">
  <img id="qr" alt="QR code">
  <input type="text" id="link" readonly>
  <div class="row">
    <button id="copy">Copiar link</button>
    <a id="download" download="qrcode.png"><button>Baixar QR code</button></a>
  </div>
</div>

<script type="module">
import { uploadPresigned } from 'https://esm.sh/@vercel/blob@2.8.2/client';
import QRCode from 'https://esm.sh/qrcode@1.5.3';

const $ = (id) => document.getElementById(id);
const MAX = 50 * 1024 * 1024;
let files = [];

function setFiles(list) {
  files = [...list].filter((f) => f.size <= MAX);
  const tooBig = list.length - files.length;
  $('selected').innerHTML = files.map((f) => `<li>${f.name}</li>`).join('');
  $('status').textContent = tooBig ? `${tooBig} arquivo(s) acima de 50 MB ignorado(s).` : '';
  $('send').disabled = !files.length;
}

$('files').onchange = (e) => setFiles(e.target.files);
const drop = $('drop');
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); setFiles(e.dataTransfer.files); };

$('send').onclick = async () => {
  $('send').disabled = true;
  const id = Array.from(crypto.getRandomValues(new Uint8Array(10)), (n) => 'abcdefghijklmnopqrstuvwxyz0123456789'[n % 36]).join('');
  try {
    for (const [i, f] of files.entries()) {
      $('status').textContent = `Enviando ${i + 1}/${files.length}: ${f.name}`;
      const name = f.name.replace(/[\/\\]/g, '_');
      await uploadPresigned(`pastas/${id}/${name}`, f, { access: 'public', handleUploadUrl: '/api/upload' });
    }
    const link = `${location.origin}/s.html?id=${id}`;
    const dataUrl = await QRCode.toDataURL(link, { width: 480, margin: 2 });
    $('qr').src = dataUrl;
    $('download').href = dataUrl;
    $('link').value = link;
    $('result').style.display = 'block';
    $('status').textContent = 'Pronto!';
  } catch (err) {
    $('status').textContent = 'Erro: ' + err.message;
    $('send').disabled = false;
  }
};

$('copy').onclick = async () => {
  await navigator.clipboard.writeText($('link').value);
  $('copy').textContent = 'Copiado!';
};
</script>
</body>
</html>
